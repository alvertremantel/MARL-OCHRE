[workspace]
members = [
    "crates/marl-cell",
    "crates/marl-config",
    "crates/marl-engine",
    "crates/marl-field",
    "crates/marl-format",
    "crates/marl-gpu",
    "crates/marl-output",
    "crates/marl-sim",
    "crates/marl-viewer-core",
    "crates/marl-viewer-render",
    "crates/marl-viewer-rs",
]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"

[workspace.dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "0.4"
rand = "0.9"
rand_distr = "0.5"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
zstd = "0.13"
egui = "0.34.2"
egui-wgpu = "0.34.2"
egui-winit = "0.34.2"
rfd = "0.17.2"
wgpu = "29"
winit = "0.30"
